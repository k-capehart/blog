baseURL: "https://kylecapehart.com"
locale: "en-us"
title: "Kyle Capehart"
theme: hugo-profile

# Multilingual configuration
defaultContentLanguage: "en"
defaultContentLanguageInSubdir: false

languages:
  en:
    label: "English"
    weight: 1
    contentDir: "content"
    # menu:
    #   main:
    #     - identifier: blog
    #       name: Blog
    #       title: Blog posts
    #       url: /blogs
    #       weight: 1
    #     - identifier: gallery
    #       name: Gallery
    #       title: Image gallery
    #       url: /gallery
    #       weight: 2

outputs:
  home:
    - "HTML"
    - "RSS"
    - "JSON"
  page:
    - "HTML"
    - "RSS"

enableRobotsTXT: true

#services:
  #googleAnalytics:
    #id: G-MEASUREMENT_ID
  #disqus:
    #shortname: your-disqus-shortname

pagination:
  pagerSize: 3

markup:
  goldmark:
    renderer:
      unsafe: true

Menus:
  main:
    - identifier: gallery
      name: Gallery
      title: Gallery
      url: /gallery
      weight: 2
