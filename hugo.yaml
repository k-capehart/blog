params:
  title: "Kyle Capehart"
  description: "Kyle Capehart's Portfolio and Blog"
  # staticPath: ""  # The path to serve the static files from
  favicon: "/favicon.ico"

  # Whether to serve bootstrap css and js files from CDN or not. Can be set to true, "css" or "js" to choose between
  # serving both, only the css, or only the js files through the CDN. Any other value will make so that CDN is not used.
  # Note the lack of "" in true, it should be of boolean type.
  useBootstrapCDN: false

  # If you want to load dynamically responsive images from Cloudinary
  # This requires your images to be uploaded + hosted on Cloudinary
  # Uncomment and change YOUR_CLOUD_NAME to the Cloud Name in your Cloudinary console
  # cloudinary_cloud_name: "YOUR_CLOUD_NAME"

  # Whether to add mathjax support on all pages. Alternatively, you can opt-in per page by adding `mathjax: true` in the frontmatter.
  mathjax: false

  # Whether the fade animations on the home page will be enabled
  animate: true

  theme:
    # disableThemeToggle: true
    # defaultTheme: "light" # dark

  font:
    fontSize: 1rem # default: 1rem
    fontWeight: 400 # default: 400
    lineHeight: 1.5 # default: 1.5
    textAlign: left # default: left

  # color preference
  # When using hex codes for colors, quotations must be used along with the # sign
  # color:
  #   textColor: "#343a40"
  #   secondaryTextColor: "#6c757d"
  #   textLinkColor: "#007bff"
  #   backgroundColor: "#eaedf0"
  #   secondaryBackgroundColor: "#64ffda1a"
  #   primaryColor: "#007bff"
  #   secondaryColor: "#f8f9fa"

  #   darkmode:
  #     textColor: "#e4e6eb"
  #     secondaryTextColor: "#b0b3b8"
  #     textLinkColor: "#ffffff"
  #     backgroundColor: "#18191a"
  #     secondaryBackgroundColor: "#212529"
  #     primaryColor: "#ffffff"
  #     secondaryColor: "#212529"

  # If you want to customize the menu, you can change it here
  navbar:
    align: ms-auto # Left: ms-auto | center: mx-auto | right: me-auto | Default: ms-auto
    # brandLogo: "/logo.png" # Logo for the brand | default is the favicon variable
    # showBrandLogo: false # Show brand logo in nav bar | default is true
    brandName: "KC" # Brand name for the brand | default is the title variable
    disableSearch: false
    # searchPlaceholder: "Search"
    stickyNavBar:
      enable : true
      showOnScrollUp : true
    enableSeparator: false
    menus:
      disableAbout: true
      disableExperience: true
      disableEducation: true
      disableProjects: true
      disableAchievements: true
      disableContact: true

  # Hero
  hero:
    enable: true
    # intro: "Hi, my name is"
    title: "Kyle Capehart"
    subtitle: "Software Engineer"
    content: "I write code and such"
    image: /images/kyle_headshot.jpg
    bottomImage:
      enable: true
    # roundImage: true # Make hero image circular | default false
    button:
      enable: true
      name: "Resume"
      url: "https://rawcdn.githack.com/k-capehart/resume/357e682c2291c9ff67cdc59d985db9f317dc0ed3/kyle_capehart_resume.pdf"
      download: false
      newPage: true
    socialLinks:
      fontAwesomeIcons:
        - icon: fab fa-github
          url: https://github.com/k-capehart
        - icon: fab fa-linkedin
          url: https://www.linkedin.com/in/kyle-capehart/
      customIcons:
        - icon: /icons/bluesky.svg
          url: https://bsky.app/profile/kylecapehart.com

  # About
  about:
    enable: false
    title: "About Me"
    image: "/images/me.png"
    content: |-
      test
    skills:
      enable: true
      title: "Here are a few technologies I've been working with recently:"
      items:
        - "HTML"
        - "CSS"
        - "JavaScript"

  # Experience
  experience:
    enable: true
    # title: "Custom Name"
    items:
      - company: "Gusto"
        companyUrl: "https://gusto.com"
        jobs:
          - name: "Sr. Software Engineer"
            date: "November 2025 - present"
            content: |-
              - End-to-end integrations between the core Ruby on Rails app and the CRM
              - Built custom CI/CD pipeline for the Salesforce developer team
              - Implemented event routing system for marketing events sent to Iterable
              - Helped lead Salesforce migration for Revenue team
            # info:
            #   content: Retirement Engineering
            # featuredItems:
            #   fontAwesomeIcons:
            #     - icon: fa-brands fa-react
            #       url: https://react.dev/
            #       tooltip: Example tooltip content
            #     - icon: fab fa-x-twitter
            #       url: https://example.com
            #       # tooltip: Example tooltip content
            #   customIcons:
            #     - icon: /fav.png
            #       url: "https://example.com"
            #       tooltip: Example tooltip content
      - company: "Guideline"
        companyUrl: "https://guideline.com"
        jobs:
          - name: "Sr. Software Engineer"
            date: "October 2024 - November 2025"
            content: |-
              - Created custom slack integration for syncing Leads to Salesforce
              - Built custom CI/CD pipeline to replace enterprise solution, saving thousands
      - company: "ATD"
        companyUrl: "https://atd.com"
        jobs:
          - name: "Technical Lead"
            date: "February 2023 - September 2024"
            content: |-
              - Lead the Customer Engagement team, building and maintaining Salesforce functionality for Sales and CX
              - Rebuilt the CI/CD pipeline using GitHub Actions
              - Managed contractors, delegating tasks and working with stakeholders
      - company: "Deloitte"
        companyUrl: "https://deloitte.com"
        jobs:
          - name: "Software Engineer"
            date: "July 2019 - February 2023"
            content: |-
              - Led development team, overseeing release for projects contracted by the FDA
              - Built time reporting application used by thousands of federal employees
              - Automated data loading tasks using Python
      - company: "Siemens"
        companyUrl: "https://siemens.com"
        jobs:
          - name: "Software Engineer Intern"
            date: "March 2018 - July 2019"
            content: |-
              - Maintained internal customer portal built in Salesforce

  # Education
  education:
    enable: true
    # title: "Custom Name"
    index: false
    items:
      - title: "B.S. in Computer Science"
        school:
          name: "University of Central Florida"
          url: "https://www.ucf.edu/"
        date: "2015 - 2019"
  # Achievements
  achievements:
    enable: false
    # title: "Custom Name"
    items:
      - title: "test"
        content: I solved all problems with optimal solution.
        url: https://example.com
        image: /images/achievement.jpg

  # projects
  projects:
    enable: false
    # title: "Custom Name"
    items:
      - title: "test"
        content: test
        image: /images/projects/profile.png
        featured:
          name: test
          link: https://example.com

  #Contact
  contact:
    enable: false
    # title: "Custom Name"
    content: My inbox is always open!
    btnName: Mail me
    btnLink: mailto:kyle@test.com
    # formspree:
    #   enable: true # `contact.email` value will be ignored
    #   formId: abcdefgh # Take it from your form's endpoint, like 'https://formspree.io/f/abcdefgh'
    #   emailCaption: "Enter your email address"
    #   messageCaption: "Enter your message here"
    #   messageRows: 5

  footer:
    recentPosts:
      path: "blogs"
      count: 3
      title: Recent Posts
      enable: false
      disableFeaturedImage: false
    socialNetworks:
      github: https://github.com/k-capehart
      linkedin: https://www.linkedin.com/in/kyle-capehart/
      bluesky: https://bsky.app/profile/kylecapehart.com
      contact: https://forms.gle/VhiMZUReoxWAS4Ts8

  # List pages like blogs and posts
  listPages:
    disableFeaturedImage: false

  # Single pages like blog and post
  singlePages:
    socialShare: true
    readTime:
      enable: true
      content: "min read"
    scrollprogress:
      enable: true
    tags:
      openInNewTab: true

  # For translations
  terms:
    read: "Read"
    toc: "Table Of Contents"
    copyright: "All rights reserved"
    emailText: "Check out this site"

  datesFormat:
    article: "Jan 2, 2006"
    articleList: "Jan 2, 2006"
    articleRecent: "Jan 2, 2006"

  #customScripts: -| # You can add custom scripts which will be added before </body> tag
